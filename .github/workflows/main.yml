name: Build Gordey Mod

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.0'

      - name: Unpack project
        run: |
          ls -la
          ZIP=$(ls *.zip | sort -V | tail -n 1)
          echo Using $ZIP
          unzip -q $ZIP -d proj
          if [ ! -f proj/build.gradle ]; then
            SUB=$(dirname $(find proj -name build.gradle | head -n 1))
            cp -a $SUB/. proj/
          fi
          ls -la proj

      - name: Resolve latest Fabric versions for 1.21.11
        working-directory: proj
        run: |
          MC=1.21.11
          YARN=$(curl -fsSL https://meta.fabricmc.net/v2/versions/yarn/$MC | jq -r '.[0].version')
          LOADER=$(curl -fsSL https://meta.fabricmc.net/v2/versions/loader | jq -r '[.[] | select(.stable==true)][0].version')
          API=$(curl -fsSL -G https://api.modrinth.com/v2/project/fabric-api/version --data-urlencode 'game_versions=["1.21.11"]' --data-urlencode 'loaders=["fabric"]' | jq -r '.[0].version_number')
          echo yarn=$YARN loader=$LOADER api=$API
          printf 'org.gradle.jvmargs=-Xmx2G\nminecraft_version=%s\nyarn_mappings=%s\nloader_version=%s\nfabric_version=%s\nmod_version=1.0.0\n' $MC $YARN $LOADER $API > gradle.properties
          cat gradle.properties

      - name: Build mod jar
        working-directory: proj
        run: gradle build --stacktrace

      - name: Collect jar
        run: |
          mkdir -p out
          find proj/build/libs -name '*.jar' ! -name '*-sources.jar' -exec cp {} out/ \;
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: Gordey-Visuals-jar
          path: out/*.jar
